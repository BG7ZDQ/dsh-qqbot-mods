# ~/.dsh/profiles/desktop/cordis.patch.yml
# 脱敏示例：把占位符换成自己的值
#   <your-app-id> / <your-app-secret>  QQ 开放平台机器人凭据
#   <workspace-path>                   任意固定工作目录（避免全盘搜索导致工具超时）
#   <preset-name>                       Agent preset id（见 docs/06 可建一个 QQ 专用 preset）
#   <your-openid>                      允许私聊的用户 openid（可选）
#
# 注意：profile patch 只能"覆盖已存在的条目"，字段是整份替换；
#       schema 里没写的字段会用默认值，所以只写你想改的部分即可。

- id: im-qqbot
  config:
    appId: '<your-app-id>'
    appSecret: '<your-app-secret>'
    # 显式路由：provider 与 model 必须同时给，否则会回退宿主默认模型链
    provider: deepseek-account
    model: deepseek-flash
    # 专用 agent preset（docs/06）；留空则用宿主默认 preset
    preset: qq
    requireMention: false          # 旁观模式必须 false
    # 固定工作目录，避免工具（glob 等）扫描用户主目录超时
    cwd: '<workspace-path>'
    historyLimit: 20
    access:
      c2cMode: allowlist
      c2cAllow:
        - <your-openid>
      groupMode: open
      groupAllow: []
    trigger:
      mentionAlways: true
      nameKeywords:
        - 小小鱼
        - 小鱼鱼
        - 小鱼
        - 鱼
        - 懒鱼
      topicKeywords:
        - 无聊
        - 好无聊
        - 安慰
        - 陪我
        - 理理我
        - 难受
        - 不开心
        - 难过
        - 烦
        - 累
        - 哄我
      topicChance: 1
      randomChance: 0.15
      cooldownMs: 120000
      followUpWindowMs: 120000
      followUpChance: 0.9
      followUpSameSenderOnly: true
      interest:
        enabled: true
        provider: ''
        model: ''
        minScore: 0.5
        invitedScore: 0.6
        followUpInvitedScore: 0.35
        followUpBias: 0.2
        maxPerMinute: 20
        timeoutMs: 8000
        maxHistory: 8
        # 判断类小模型调用必须给足输出上限，否则推理会吃光正文
        maxTokens: 800
        persona: 12岁活泼少女，喜欢聊天、可爱的东西、游戏、气球/航模这类科技小玩意、被夸；讨厌被当办公助手使唤、讨厌无聊的指令。
    proactive:
      enabled: true
      morningGreet: true
      morningFrom: 7
      morningTo: 9
      morningSpreadMs: 1800000
      greetQuietMs: 0
      nightQuietFrom: 23
      nightQuietTo: 7
      randomChime: true
      chimeIntervalMs: 10800000
      chimeChance: 0.35
      chimeActivityMs: 21600000
      chimeQuietMs: 1800000
      chimeBotQuietMs: 600000
      startupGraceMs: 600000
      alarm: true
      sulk: true
      sulkAfterMs: 180000
      sulkMaxPerHour: 3
      sulkOnlyOnBid: true
      sulkJudge: true
      sulkJudgeTimeoutMs: 6000
      muteAfterIgnored: 1
      muteMs: 300000
      dailyMax: 12
    memory:
      enabled: true
      maxFacts: 12
      maxPersonFacts: 6
      maxShortTerm: 6
      shortTermTtlMs: 86400000
      mirrorPersonFacts: true
      maxUsers: 500
      # 0 = 不按消息条数触发；聊天安静 2 分钟后整理 / 最长 10 分钟强制整理
      distillEvery: 0
      distillIdleMs: 120000
      distillMaxIntervalMs: 600000
      maxPending: 80
      # 整理输出上限（含 reasoning 余量）
      maxTokens: 20000
      timeoutMs: 60000
    persona:
      enabled: true
      awakeFromHour: 7
      sleepFromHour: 23
      moodDecayMs: 1800000
      sleepyMultiplier: 0.2
      happyMultiplier: 1.3
      lowMultiplier: 0.5
    vision:
      enabled: true
      provider: deepseek-account
      model: deepseek-flash
      defaultPrompt: 用中文简洁描述这张图片；图里有文字就把文字读出来。
      maxBytes: 10485760
      maxTokens: 1024
      timeoutMs: 120000

- id: tool-fs-search
  config:
    # 大目录 glob 超时兜底
    sampleOverCapGlobResults: false
    timeoutMs: 180000
